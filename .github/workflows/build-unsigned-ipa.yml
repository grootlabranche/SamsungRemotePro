name: Construire l’IPA Sideloadly

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: IPA iPhone non signée
    runs-on: macos-26-intel

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Vérifier l’environnement Apple et les fichiers de configuration
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          echo "Architecture du runner : $(uname -m)"
          test -d "SamsungRemotePro.xcodeproj" || {
            echo "::error::SamsungRemotePro.xcodeproj doit être à la racine du dépôt."
            exit 1
          }
          plutil -lint Config/Info.plist Config/WidgetInfo.plist WatchApp/Info.plist

      - name: Vérifier la syntaxe Swift et les invariants du projet
        shell: bash
        run: bash Scripts/validate-launcher-fix.sh

      - name: Vérifier le schéma partagé
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -project "SamsungRemotePro.xcodeproj"

      - name: Compiler et archiver sans signature
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "SamsungRemotePro.xcodeproj" \
            -scheme "SamsungRemotePro" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SamsungRemotePro.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/xcodebuild-archive.log"

      - name: Créer et vérifier l’IPA non signée
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/SamsungRemotePro.xcarchive/Products/Applications/SamsungRemotePro.app"
          IPA_DIR="$RUNNER_TEMP/ipa"
          IPA="$GITHUB_WORKSPACE/SamsungRemotePro-unsigned.ipa"

          if [ ! -d "$APP" ]; then
            echo "::error::Application introuvable dans l’archive : $APP"
            find "$RUNNER_TEMP/SamsungRemotePro.xcarchive/Products/Applications" -maxdepth 3 -print 2>/dev/null || true
            exit 1
          fi

          mkdir -p "$IPA_DIR/Payload"
          ditto "$APP" "$IPA_DIR/Payload/SamsungRemotePro.app"
          (cd "$IPA_DIR" && /usr/bin/zip -qry "$IPA" Payload)
          test -s "$IPA"

          # Validate the archive before publishing it. Write command output to files
          # before previewing it, so pipefail cannot turn a successful unzip into a failure.
          /usr/bin/unzip -t "$IPA" > "$RUNNER_TEMP/ipa-validation.txt"
          /usr/bin/unzip -l "$IPA" > "$RUNNER_TEMP/ipa-contents.txt"
          tail -n 2 "$RUNNER_TEMP/ipa-validation.txt"
          head -n 30 "$RUNNER_TEMP/ipa-contents.txt"
          ls -lh "$IPA"

      - name: Publier l’IPA à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: SamsungRemotePro-unsigned-ipa
          path: SamsungRemotePro-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
