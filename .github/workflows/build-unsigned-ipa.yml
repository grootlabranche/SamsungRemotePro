name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Validate and package iOS IPA
    runs-on: macos-26-intel
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Xcode and project configuration
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          plutil -lint Config/Info.plist Config/WidgetInfo.plist
          test -d SamsungRemotePro.xcodeproj

      - name: Validate Swift syntax and iOS project invariants
        shell: bash
        run: bash Scripts/validate-launcher-fix.sh

      - name: List schemes
        run: xcodebuild -list -project SamsungRemotePro.xcodeproj

      - name: Archive iOS app without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SamsungRemotePro.xcodeproj \
            -scheme SamsungRemotePro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SamsungRemotePro.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-archive.log"

      - name: Package and validate IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/SamsungRemotePro.xcarchive/Products/Applications/SamsungRemotePro.app"
          IPA="$GITHUB_WORKSPACE/SamsungRemotePro-unsigned.ipa"
          STAGING="$RUNNER_TEMP/ipa-staging"
          test -d "$APP" || { echo "::error::Archived iOS app not found"; exit 1; }
          mkdir -p "$STAGING/Payload"
          ditto "$APP" "$STAGING/Payload/SamsungRemotePro.app"
          (cd "$STAGING" && /usr/bin/zip -qry "$IPA" Payload)
          test -s "$IPA"
          /usr/bin/unzip -t "$IPA" > "$RUNNER_TEMP/ipa-validation.txt"
          tail -n 2 "$RUNNER_TEMP/ipa-validation.txt"
          ls -lh "$IPA"

      - name: Upload IPA build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SamsungRemotePro-unsigned-ipa
          path: SamsungRemotePro-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Samsung Remote Pro ${{ github.ref_name }}
          generate_release_notes: true
          files: SamsungRemotePro-unsigned.ipa
          fail_on_unmatched_files: true
